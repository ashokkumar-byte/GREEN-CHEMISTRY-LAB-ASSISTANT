<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Profile - Green Chemistry</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">🌱 Green Chemistry Lab Assistant</a>
    <nav class="navlinks">
      <a href="experiments.html">Experiments</a>
      <a href="quiz.html">Quiz</a>
      <a href="history.html">History</a>
      <a href="dashboard.html">Dashboard</a>
      <a class="btn" id="navAuthBtn" href="login.html">Login</a>
    </nav>
  </header>

  <div class="container section">
    <div style="max-width:560px;margin:0 auto">
      <h1 style="margin-bottom:6px">👤 Student Profile</h1>
      <p class="muted">Manage your student details. These are printed on your official laboratory records and learning certificates.</p>

      <form id="profileForm" class="card" style="margin-top:20px;padding:30px">
        <label style="font-weight:700">Full Name</label>
        <input id="name" name="name" class="input" placeholder="Your full name" required>

        <label style="font-weight:700">Student Roll / Username</label>
        <input id="username" class="input" disabled style="background:#f4fbf7;cursor:not-allowed">

        <label style="font-weight:700">Email Address</label>
        <input id="email" name="email" type="email" class="input" placeholder="student@university.edu" required>

        <div id="msg" style="margin:12px 0"></div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px">
          <a class="btn secondary" href="dashboard.html">← Dashboard</a>
          <button class="btn" type="submit">Save Profile</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Floating AI Assistant Launcher -->
  <a href="ai-assistant.html" class="floating-ai-btn" title="Ask AI Assistant">
    <span>🤖</span>
    <span>Ask AI Assistant</span>
  </a>

  <footer class="footer">Green Chemistry Lab Assistant • Learn safely • Think sustainably</footer>

  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
